services:
  - type: web
    name: compiler-backend
    env: docker
    branch: main
    dockerfilePath: backend/Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /health
services:
  - type: web
    name: compiler-lab
    runtime: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
  - type: web
    name: java-service
    env: docker
    branch: main
    dockerfilePath: java_service/Dockerfile
    plan: starter
    autoDeploy: false
    healthCheckPath: /health
