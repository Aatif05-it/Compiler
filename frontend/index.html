<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Free C/C++/Java Compiler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>

    <main class="shell">
      <header class="topbar">
        <div class="header-brand">
          <svg class="logo" viewBox="0 0 40 40" width="40" height="40">
            <defs>
              <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
              </linearGradient>
            </defs>
            <rect width="40" height="40" rx="8" fill="url(#logoGrad)" />
            <path d="M10 20l6 6 14-14" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="28" cy="12" r="2.5" fill="white" opacity="0.6" />
          </svg>
          <div class="brand-text">
            <h1>CodeSync</h1>
            <p class="tagline">Online Compiler</p>
          </div>
        </div>
        <p class="description">Write, compile, and run C, C++, and Java code instantly online.</p>
      </header>

      <section class="panel editor-panel">
        <div class="row">
          <label for="language">Language</label>
          <select id="language">
            <option value="c">C</option>
            <option value="cpp">C++</option>
            <option value="java">Java</option>
          </select>
        </div>

        <label for="code">Source Code</label>
        <textarea id="code" spellcheck="false"></textarea>

        <label for="stdin">Program Input (stdin)</label>
        <textarea id="stdin" class="small" spellcheck="false"></textarea>

        <div class="actions">
          <button id="runBtn">Compile + Run</button>
          <span id="status">Ready</span>
        </div>
      </section>

      <section class="panel output-panel">
        <h2>Output</h2>
        <pre id="output">No output yet.</pre>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
