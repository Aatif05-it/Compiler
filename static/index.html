<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Free C/C++/Java Compiler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>

    <main class="shell">
      <header class="topbar">
        <h1>Compiler Lab</h1>
        <p>Run C, C++, and Java code in one free deployable app.</p>
      </header>

      <section class="panel editor-panel">
        <div class="row">
          <label for="language">Language</label>
          <select id="language">
            <option value="c">C</option>
            <option value="cpp">C++</option>
            <option value="java">Java</option>
          </select>
        </div>

        <label for="code">Source Code</label>
        <textarea id="code" spellcheck="false"></textarea>

        <label for="stdin">Program Input (stdin)</label>
        <textarea id="stdin" class="small" spellcheck="false"></textarea>

        <div class="actions">
          <button id="runBtn">Compile + Run</button>
          <span id="status">Ready</span>
        </div>
      </section>

      <section class="panel output-panel">
        <h2>Output</h2>
        <pre id="output">No output yet.</pre>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
